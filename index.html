
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NJIT ACM Semester Events</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 80px 8%;
      background: #061426;
      color: #f1f5f9;
      font-family: Arial, Helvetica, sans-serif;
    }

    .label {
      color: #52d8eb;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 5rem);
      margin: 20px 0;
    }

    p {
      color: #b9c7d5;
    }

    .event {
      display: block;
      max-width: 550px;
      margin-top: 40px;
      padding: 25px;
      background: #0b2036;
      border: 1px solid #244158;
      text-decoration: none;
      color: white;
    }

    .event:hover {
      border-color: #52d8eb;
    }

    .event h2 {
      color: #52d8eb;
    }
  </style>
</head>
<body>

  <p class="label">NJIT ACM</p>
  <h1>Semester Events</h1>
  <p>Explore upcoming events hosted by NJIT ACM.</p>

  <a class="event" href="events/load-bear/">
    <p>FEATURED EVENT</p>
    <h2>LOAD BEAR →</h2>
    <p>$250 prize pool</p>
  </a>

</body>
</html>
